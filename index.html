<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Tour du Monde d’Alexis</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14141f; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      /* Phaser demande un agrandissement net, qui abîmerait les cartes illustrées. */
      #game canvas { image-rendering: auto !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="back-button" type="button" tabindex="-1" hidden>Retour</button>
    <button id="sound-button" type="button" tabindex="-1" aria-label="Couper le son" hidden>
      <svg class="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3v10.6a4 4 0 1 0 2 3.4V7h4V3h-6z" />
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3v10.6a4 4 0 1 0 2 3.4V7h4V3h-6z" />
        <path d="M3 3.5 4.5 2 22 19.5 20.5 21z" />
      </svg>
    </button>
    <div id="dialog" hidden>
      <p id="dialog-text"></p>
      <button id="dialog-listen" type="button" aria-label="Écouter" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" />
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
